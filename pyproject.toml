[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "order-ops-superagent"
version = "0.1.0"
description = "服装批发订单的多 Agent 调度系统（订单变更协调层）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "baciozz" }]
dependencies = [
    "alembic==1.20.1",
    "defusedxml==0.7.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "openpyxl==3.1.5",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest-cov==7.1.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[project.scripts]
oos = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "schemas*", "seeds*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "schemas", "seeds", "tests"]
extend-exclude = [".venv", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true
