name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OOS_LIVE_ENABLED: "false"
      # This private evaluation set must stay sealed during normal CI.
      PYTEST_ADDOPTS: "--ignore=tests/test_beta_dataset.py"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/benchmarks/datasets/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Check formatting, lint, types, and coverage (protected dataset excluded)
        run: make check
      - name: Evaluate offline fixtures
        run: make eval-offline
      - name: Provision locked wheel dependencies
        run: |
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/wheelhouse" -r requirements-build.lock -r requirements.lock
      - name: Check ordinary installed wheel offline
        run: make check-wheel WHEELHOUSE="$RUNNER_TEMP/wheelhouse" WHEEL_OUTPUT="$RUNNER_TEMP/wheel-evidence"
